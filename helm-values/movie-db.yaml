fullnameOverride: movie-db
image: {repository: postgres, tag: 12.1-alpine}
containerPort: 5432
probes: {enabled: false}
service: {type: ClusterIP, port: 5432, targetPort: 5432, nodePort: null}
env:
  - {name: POSTGRES_USER, value: movie_db_username}
  - {name: POSTGRES_PASSWORD, value: movie_db_password}
  - {name: POSTGRES_DB, value: movie_db_dev}
