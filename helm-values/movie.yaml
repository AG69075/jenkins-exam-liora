fullnameOverride: movie-service
image:
  repository: ag69075/movie-service
containerPort: 8000
probes: {enabled: false}
service: {type: ClusterIP, port: 8000, targetPort: 8000, nodePort: null}
env:
  - {name: DATABASE_URI, value: "postgresql://movie_db_username:movie_db_password@movie-db/movie_db_dev"}
  - {name: CAST_SERVICE_HOST_URL, value: "http://cast-service:8000/api/v1/casts/"\}
